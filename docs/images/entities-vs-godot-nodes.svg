<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Entities as Godot nodes vs. the entity table">
<title>Entities as Godot nodes vs. the entity table</title>
<rect x="0.5" y="0.5" width="719" height="379" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="34" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Entities as Godot nodes vs. the entity table</text>
<text x="24" y="54" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">1,000,000 entities, same process, same arithmetic, median of 5 runs, one thread. Shorter is better.</text>
<line x1="286.5" y1="92" x2="286.5" y2="298" stroke="#e5e7eb"/>
<text x="286.47709909445166" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">1 ms</text>
<line x1="407.7" y1="92" x2="407.7" y2="298" stroke="#e5e7eb"/>
<text x="407.65139939630114" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">10 ms</text>
<line x1="528.8" y1="92" x2="528.8" y2="298" stroke="#e5e7eb"/>
<text x="528.8256996981506" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">100 ms</text>
<line x1="650.0" y1="92" x2="650.0" y2="298" stroke="#e5e7eb"/>
<text x="650.0" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">1000 ms</text>
<text x="238" y="130" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Create 1 M entities</text>
<rect x="250" y="106" width="374.4" height="20" rx="3" fill="#d97706"/>
<text x="632.4170898777771" y="121" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">615 ms</text>
<rect x="250" y="132" width="169.0" height="20" rx="3" fill="#2563eb"/>
<text x="426.97170672885466" y="147" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">12.4 ms  (50x faster)</text>
<text x="238" y="196" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Destroy 1 M entities</text>
<rect x="250" y="172" width="369.2" height="20" rx="3" fill="#d97706"/>
<text x="627.2041810998265" y="187" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">557 ms</text>
<rect x="250" y="198" width="132.5" height="20" rx="3" fill="#2563eb"/>
<text x="390.49460763440294" y="213" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">6.2 ms  (90x faster)</text>
<text x="238" y="262" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Update 1 M positions (one pass)</text>
<rect x="250" y="238" width="306.1" height="20" rx="3" fill="#d97706"/>
<text x="564.1273942627943" y="253" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">168 ms</text>
<rect x="250" y="264" width="36.5" height="20" rx="3" fill="#2563eb"/>
<text x="294.47709909445166" y="279" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">1 ms  (168x faster)</text>
<rect x="250" y="315" width="14" height="14" rx="3" fill="#d97706"/>
<text x="272" y="326" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Godot Node3D objects</text>
<rect x="440" y="315" width="14" height="14" rx="3" fill="#2563eb"/>
<text x="462" y="326" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Tessera Net entity table</text>
<text x="24" y="362" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Log scale. Nodes are created and updated through the extension API, so engine-internal code would be faster.</text>
</svg>
