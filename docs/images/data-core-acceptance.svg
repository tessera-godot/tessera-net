<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Data core: measured value vs. its limit">
<title>Data core: measured value vs. its limit</title>
<rect x="0.5" y="0.5" width="719" height="379" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="34" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Data core: measured value vs. its limit</text>
<text x="24" y="54" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">1,000,000 entities, Release build, median of 5 runs, desktop CPU with 12 cores. Bars shorter than the red line pass.</text>
<line x1="250.0" y1="84" x2="250.0" y2="332" stroke="#e5e7eb"/>
<text x="250.0" y="78" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">0%</text>
<line x1="335.0" y1="84" x2="335.0" y2="332" stroke="#e5e7eb"/>
<text x="335.0" y="78" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">25%</text>
<line x1="420.0" y1="84" x2="420.0" y2="332" stroke="#e5e7eb"/>
<text x="420.0" y="78" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">50%</text>
<line x1="505.0" y1="84" x2="505.0" y2="332" stroke="#e5e7eb"/>
<text x="505.0" y="78" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">75%</text>
<line x1="590.0" y1="84" x2="590.0" y2="332" stroke="#e5e7eb"/>
<text x="590.0" y="78" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">100%</text>
<text x="238" y="114" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Create 1 M entities</text>
<rect x="250" y="100" width="124.8" height="20" rx="3" fill="#2563eb"/>
<text x="604" y="115" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">11.75 of 32 ms</text>
<text x="238" y="154" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Destroy 1 M entities</text>
<rect x="250" y="140" width="161.2" height="20" rx="3" fill="#2563eb"/>
<text x="604" y="155" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">5.69 of 12 ms</text>
<text x="238" y="194" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Churn: replace 10% ten times</text>
<rect x="250" y="180" width="29.7" height="20" rx="3" fill="#2563eb"/>
<text x="604" y="195" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">36.7 of 420 ms</text>
<text x="238" y="234" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Iterate 1 M entities (one pass)</text>
<rect x="250" y="220" width="155.3" height="20" rx="3" fill="#2563eb"/>
<text x="604" y="235" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">1.37 of 3 ms</text>
<text x="238" y="274" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Bookkeeping per entity</text>
<rect x="250" y="260" width="180.6" height="20" rx="3" fill="#2563eb"/>
<text x="604" y="275" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">4.25 of 8 bytes</text>
<text x="238" y="314" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Tick jitter at 30 Hz (p99)</text>
<rect x="250" y="300" width="10.2" height="20" rx="3" fill="#2563eb"/>
<text x="604" y="315" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">0.06 of 2 ms</text>
<line x1="590" y1="84" x2="590" y2="332" stroke="#dc2626" stroke-width="1.5"/>
<text x="590" y="354" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">limit</text>
<text x="24" y="358" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Also: 91 to 95% parallel efficiency with 8 workers, and identical results with 1 and 8 workers.</text>
</svg>
