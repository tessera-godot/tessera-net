<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Relevancy: time per tick">
<title>Relevancy: time per tick</title>
<rect x="0.5" y="0.5" width="719" height="399" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="34" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Relevancy: time per tick</text>
<text x="24" y="54" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Median of 4 runs, desktop CPU with 12 cores, Release build. Shorter is better.</text>
<line x1="270.0" y1="92" x2="270.0" y2="316" stroke="#e5e7eb"/>
<text x="270.0" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">0.1 ms</text>
<line x1="396.7" y1="92" x2="396.7" y2="316" stroke="#e5e7eb"/>
<text x="396.6666666666667" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">1 ms</text>
<line x1="523.3" y1="92" x2="523.3" y2="316" stroke="#e5e7eb"/>
<text x="523.3333333333334" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">10 ms</text>
<line x1="650.0" y1="92" x2="650.0" y2="316" stroke="#e5e7eb"/>
<text x="650.0" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">100 ms</text>
<text x="258" y="128" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">128 players, 1 M entities, 1 thread</text>
<rect x="270" y="112" width="128.3" height="22" rx="3" fill="#2563eb"/>
<text x="280" y="128" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">1.03 ms</text>
<line x1="434.8" y1="106" x2="434.8" y2="140" stroke="#dc2626" stroke-width="2"/>
<line x1="419.0" y1="106" x2="419.0" y2="140" stroke="#16a34a" stroke-width="2"/>
<text x="258" y="182" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">128 players, 1 M entities, 8 workers</text>
<rect x="270" y="166" width="65.7" height="22" rx="3" fill="#2563eb"/>
<text x="280" y="182" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">0.33 ms</text>
<line x1="377.0" y1="160" x2="377.0" y2="194" stroke="#dc2626" stroke-width="2"/>
<line x1="346.3" y1="160" x2="346.3" y2="194" stroke="#16a34a" stroke-width="2"/>
<text x="258" y="236" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">32 players, 250 k entities, 1 thread</text>
<rect x="270" y="220" width="58.6" height="22" rx="3" fill="#2563eb"/>
<text x="280" y="236" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">0.29 ms</text>
<text x="258" y="290" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">32 players, 250 k entities, 8 workers</text>
<rect x="270" y="274" width="0.0" height="22" rx="3" fill="#2563eb"/>
<text x="280" y="290" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">0.10 ms</text>
<rect x="270" y="333" width="14" height="14" rx="3" fill="#2563eb"/>
<text x="292" y="344" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">measured</text>
<rect x="370" y="333" width="4" height="14" fill="#dc2626"/>
<text x="382" y="344" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">regression limit</text>
<rect x="500" y="333" width="4" height="14" fill="#16a34a"/>
<text x="512" y="344" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">goal</text>
<text x="24" y="382" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Log scale. Both goals are met in the main scenario; the limits only guard against regressions.</text>
</svg>
