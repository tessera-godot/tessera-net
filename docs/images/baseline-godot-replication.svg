<text transform="rotate(-90 18 200.0)" x="18" y="200.0" font-size="11" fill="#6b7280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">server frame rate (fps)</text>
<rect x="100.0" y="90.0" width="90.0" height="220.0" rx="3" fill="#2563eb"/>
