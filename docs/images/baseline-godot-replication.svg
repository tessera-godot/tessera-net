<text x="24" y="54" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">8 clients see every entity, one position per entity at 20 Hz, one machine (localhost). Target: 60 fps.</text>
