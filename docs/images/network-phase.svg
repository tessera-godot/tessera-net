<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="Network phase: time per tick">
<title>Network phase: time per tick</title>
<rect x="0.5" y="0.5" width="719" height="309" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="34" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Network phase: time per tick</text>
<text x="24" y="54" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">128 players, 200,000 entities, 5% packet loss. Median of 4 runs, desktop CPU, Release build. Shorter is better.</text>
<line x1="278.6" y1="92" x2="278.6" y2="208" stroke="#e5e7eb"/>
<text x="278.5894247635494" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">1 ms</text>
<line x1="440.0" y1="92" x2="440.0" y2="208" stroke="#e5e7eb"/>
<text x="440.0" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">10 ms</text>
<line x1="601.4" y1="92" x2="601.4" y2="208" stroke="#e5e7eb"/>
<text x="601.4105752364505" y="86" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">100 ms</text>
<text x="218" y="128" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">128 players, 1 thread</text>
<rect x="230" y="112" width="290.7" height="22" rx="3" fill="#2563eb"/>
<text x="240" y="128" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">31.6 ms</text>
<line x1="552.8" y1="106" x2="552.8" y2="140" stroke="#dc2626" stroke-width="2"/>
<line x1="362.3" y1="106" x2="362.3" y2="140" stroke="#16a34a" stroke-width="2"/>
<text x="218" y="182" font-size="13" fill="#1f2937" text-anchor="end" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">128 players, 8 workers</text>
<rect x="230" y="166" width="200.2" height="22" rx="3" fill="#2563eb"/>
<text x="240" y="182" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">8.7 ms</text>
<line x1="472.9" y1="160" x2="472.9" y2="194" stroke="#dc2626" stroke-width="2"/>
<line x1="278.6" y1="160" x2="278.6" y2="194" stroke="#16a34a" stroke-width="2"/>
<rect x="230" y="225" width="14" height="14" rx="3" fill="#2563eb"/>
<text x="252" y="236" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">measured</text>
<rect x="330" y="225" width="4" height="14" fill="#dc2626"/>
<text x="342" y="236" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">regression limit</text>
<rect x="460" y="225" width="4" height="14" fill="#16a34a"/>
<text x="472" y="236" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">goal</text>
<text x="24" y="292" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Log scale. Neither goal is met yet. A player receives 98 kbps on average, within the goal of 100.</text>
